<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="CBT Minyan">
  <rect width="512" height="512" rx="112" fill="#0f1e2e"/>

  <!-- Teal accent arc behind the menorah, echoing the CBT logo -->
  <path d="M 80 280 Q 80 180 256 130 Q 432 180 432 280"
        fill="none" stroke="#3a8a8a" stroke-width="22"
        stroke-linecap="round" opacity="0.55"/>

  <!-- Gold menorah -->
  <g stroke="#d9c194" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 7 candles, fan layout (center tallest) -->
    <line x1="90"  y1="218" x2="90"  y2="150"/>
    <line x1="146" y1="190" x2="146" y2="118"/>
    <line x1="202" y1="170" x2="202" y2="94"/>
    <line x1="256" y1="160" x2="256" y2="78"/>
    <line x1="310" y1="170" x2="310" y2="94"/>
    <line x1="366" y1="190" x2="366" y2="118"/>
    <line x1="422" y1="218" x2="422" y2="150"/>

    <!-- Branch arcs joining candle bases to the central stem -->
    <path d="M 90  218 Q 90  300 256 300 Q 422 300 422 218"/>
    <path d="M 146 190 Q 146 278 256 278 Q 366 278 366 190"/>
    <path d="M 202 170 Q 202 258 256 258 Q 310 258 310 170"/>

    <!-- Center stem & base -->
    <line x1="256" y1="300" x2="256" y2="396"/>
    <line x1="222" y1="380" x2="290" y2="380"/>
    <line x1="190" y1="420" x2="322" y2="420"/>
  </g>
</svg>
